# ดึงข่าวประจำวัน — ทุกวัน 00:00 UTC (07:00 น. เวลาไทย) รอบจริงอาจช้ากว่ากำหนดได้บ้าง
# กดรันเองได้ที่แท็บ Actions → "Daily news" → Run workflow
name: Daily news

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# รอบประจำวันและสรุปรายสัปดาห์ใช้กลุ่มเดียวกัน จะได้ไม่บันทึกไฟล์ชนกันในเช้าวันอาทิตย์
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and label news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily.py

      - name: Save results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Daily news $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
